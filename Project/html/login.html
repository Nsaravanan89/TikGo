<!doctype html>
<html lang="en">
  <head>
    <title>TikGo Ticket Booking - Login</title>
    <link rel="icon" href="../images/train.jpg" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h1 class="brand-title">TikGo Ticket Booking</h1>

      <form id="loginForm">
        <div class="input-group">
          <label for="username">UserName</label>
          <input
            type="text"
            id="username"
            placeholder="Enter Your UserName"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter Your Password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="signup-link">
        <span>New here? </span><a href="register.html">Create an account</a>
      </div>
    </div>

    <script src="../Js/login.js"></script>
  </body>
</html>
